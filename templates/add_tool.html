<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=2">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">GoSpace App</h1>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/calculator">Calculator</a></li>
                <li><a href="/contact">Contact</a></li>
                <li><a href="/contacts">View Contacts</a></li>
                <li><a href="/agents">AI Agents</a></li>
                <li><a href="/tools" class="active">AI Tools</a></li>
            </ul>
        </div>
    </nav>

    <div class="container main-content">
        <div class="form-container">
            <h1>🛠️ Add New AI Tool</h1>
            <p style="color: #666; margin-bottom: 2rem;">Add a new AI tool to the repository</p>

            {{ if .error }}
            <div class="alert alert-error">
                {{ .error }}
            </div>
            {{ end }}

            <form method="POST" action="/tools/add">
                <div class="form-horizontal">
                <div class="form-group">
                    <label for="name">Tool Name *</label>
                    <input type="text" id="name" name="name" required placeholder="e.g., LangChain">
                </div>

                <div class="form-group">
                    <label for="description">Description *</label>
                    <input type="text" id="description" name="description" required placeholder="Brief description of the tool">
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" name="category" required>
                        <option value="">Select a category</option>
                        <option value="Framework">Framework</option>
                        <option value="Library">Library</option>
                        <option value="API">API</option>
                        <option value="CLI Tool">CLI Tool</option>
                        <option value="Model">Model</option>
                        <option value="Dataset">Dataset</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="language">Programming Language</label>
                    <select id="language" name="language">
                        <option value="">Select a language</option>
                        <option value="Python">Python</option>
                        <option value="JavaScript">JavaScript</option>
                        <option value="TypeScript">TypeScript</option>
                        <option value="Go">Go</option>
                        <option value="Java">Java</option>
                        <option value="C++">C++</option>
                        <option value="Rust">Rust</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="version">Version</label>
                    <input type="text" id="version" name="version" placeholder="e.g., 1.0.0">
                </div>

                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" placeholder="Author or organization name">
                </div>

                <div class="form-group">
                    <label for="repository">Repository URL</label>
                    <input type="url" id="repository" name="repository" placeholder="https://github.com/user/repo">
                </div>

                <div class="form-group">
                    <label for="tags">Tags (comma-separated)</label>
                    <input type="text" id="tags" name="tags" placeholder="e.g., llm, embeddings, vector-db">
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="active" selected>Active</option>
                        <option value="experimental">Experimental</option>
                        <option value="deprecated">Deprecated</option>
                    </select>
                </div>
                </div>

                <div class="form-group form-group-full">
                    <label for="source_code">Source Code</label>
                    <textarea id="source_code" name="source_code" rows="15" placeholder="Paste your tool source code here..." style="font-family: 'Courier New', monospace; font-size: 0.9rem;"></textarea>
                </div>

                <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary">Add Tool</button>
                <a href="/tools" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 GoSpace App. Built with Go and Gin Framework.</p>
        </div>
    </footer>

</body>
</html>
